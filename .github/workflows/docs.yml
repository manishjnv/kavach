name: docs
on:
  pull_request:
    paths: ["**/*.md", ".vale.ini", "styles/**"]
  push:
    branches: [main]
    paths: ["**/*.md", ".vale.ini", "styles/**"]
jobs:
  vale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@v2.1.1
        with:
          files: '["README.md", "CONTRIBUTING.md", "SECURITY.md", "docs"]'
          fail_on_error: true
